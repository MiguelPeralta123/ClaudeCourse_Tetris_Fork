<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <header>
      <h1>TETRIS</h1>
      <div class="theme-switch">
        <label class="switch">
          <input type="checkbox" id="theme-toggle" checked>
          <span class="slider"></span>
        </label>
        <span class="theme-label">Dark/Light</span>
      </div>
    </header>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <!-- Tabla de records local (localStorage) -->
    <section class="records" aria-label="Records">
      <div class="records-header">
        <span class="label">RECORDS</span>
        <button id="reset-records-btn" type="button">Resetear</button>
      </div>
      <ol id="records-list" class="records-list"></ol>
      <p id="records-stats" class="records-stats"></p>
    </section>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="overlay-extra" class="hidden">
          <form id="name-form" class="name-form">
            <input type="text" id="player-name" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
            <button type="submit" id="save-btn">Guardar</button>
          </form>
          <p id="overlay-status"></p>
          <ol id="overlay-records" class="records-list"></ol>
          <p id="overlay-stats" class="records-stats"></p>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
