<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <header>
      <h1>TETRIS</h1>
      <div class="theme-switch">
        <label class="switch">
          <input type="checkbox" id="theme-toggle" checked>
          <span class="slider"></span>
        </label>
        <span class="theme-label">Dark/Light</span>
      </div>
    </header>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box" id="game-over-panel">
        <p class="overlay-title" id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn" class="overlay-btn">Reiniciar</button>
      </div>

      <div class="overlay-box hidden" id="pause-panel">
        <p class="overlay-title">PAUSA</p>
        <button id="resume-btn" class="overlay-btn">Reanudar</button>
        <button id="pause-restart-btn" class="overlay-btn secondary">Reiniciar</button>
        <button id="controls-btn" class="overlay-btn secondary">Ver controles</button>
        <label class="level-select">
          <span>Nivel inicial</span>
          <select id="start-level">
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
        </label>
      </div>

      <div class="overlay-box hidden" id="controls-panel">
        <p class="overlay-title">CONTROLES</p>
        <ul class="overlay-controls">
          <li><span>Mover</span><span><kbd>←</kbd> <kbd>→</kbd></span></li>
          <li><span>Rotar</span><span><kbd>↑</kbd> <kbd>X</kbd></span></li>
          <li><span>Bajar</span><span><kbd>↓</kbd></span></li>
          <li><span>Caída</span><span><kbd>Space</kbd></span></li>
          <li><span>Pausa</span><span><kbd>P</kbd> <kbd>Esc</kbd></span></li>
        </ul>
        <button id="back-btn" class="overlay-btn secondary">Volver</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
